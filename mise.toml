[tools]
go = "1.27.3"
actionlint = "1.7.12"
zizmor = "1.31.1"
fnox = "1.47.0"
gh = "2.103.3"
"go:golang.org/x/tools/gopls" = "v0.24.0"
"go:golang.org/x/tools/cmd/goimports" = "v0.52.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0"
"go:github.com/nametake/golangci-lint-langserver" = "v0.0.12"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "v0.25.0"
"go:github.com/goreleaser/goreleaser/v2" = "v2.19.0"
hk = "2.8.1"
pkl = "0.32.2"
terraform = "1.17.1"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[tasks.build]
description = "Build the provider binary"
run = "go build -v ./..."
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["terraform-provider-forwardemail"]

[tasks.test]
description = "Run acceptance tests against the provider (API key from Bitwarden Secrets Manager)"
env = { TF_ACC = "true" }
run = """
go mod tidy
fnox exec -- go test ./forwardemail/... -v -timeout=30m
mise run sweep
"""

[tasks.docs]
description = "Update the docs generated from description fields"
run = [
  "cd tools; go generate ./...",
  "sed -i.bak 's/forwardemail Provider/Forward Email Provider/g' docs/index.md && rm docs/index.md.bak",
]
sources = [
  "forwardemail/**/*.go",
  "main.go",
  "examples/**/*.tf",
  "examples/**/*.sh",
]
outputs = ["docs/**/*.md"]

[tasks.fmt]
description = "Run gofmt against the provider"
run = "gofmt -s -w -r 'interface{} -> any' ."

[tasks.lint]
description = "Run linters against the provider"
run = """
golangci-lint run
BADFMT=$(gofmt -s -l -r 'interface{} -> any' .)
test -z "$BADFMT" || (echo -e "Invalid gofmt:\\n$BADFMT"; exit 1)
go vet ./...
"""

[tasks.release-check]
description = "Validate the goreleaser release configuration"
run = "goreleaser check"

[tasks.release-dry]
description = "Build the release artifacts locally without publishing or signing"
run = "goreleaser release --snapshot --clean --skip=sign"

[tasks.release]
description = "Build, sign, and publish a release for the current tag (requires GITHUB_TOKEN and a GPG key)"
run = "goreleaser release --clean"

[tasks.install]
description = "Set up an override allowing a local version of the provider to be used"
run = """
BIN_DIR=$(go env GOBIN)
[ -n "$BIN_DIR" ] || BIN_DIR=$(go env GOPATH)/bin
cat <<EOF > "$HOME/.terraformrc"
provider_installation {
  dev_overrides {
    "smokeythemonkey/forwardemail" = "$BIN_DIR"
  }
  direct {}
}
EOF
go install .
"""

[tasks.uninstall]
description = "Remove any local overrides for local development"
run = 'rm -f "$HOME/.terraformrc"'

[tasks.sweep]
description = "Run sweeper tests to clean up resources. WARNING: This will destroy resources! Use with caution."
run = "fnox exec -- go test ./forwardemail -v -timeout 5m -sweep=forwardemail"

[tasks.prep]
description = "Prepare the provider"
depends = ["fmt", "lint", "docs", "install"]
run = "go mod tidy"

[tasks.pre-commit]
run = "hk run pre-commit"
