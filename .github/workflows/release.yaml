# Terraform Provider release workflow.
#
# Triggered by pushing a v-prefixed tag. goreleaser creates the GitHub
# release itself, including the platform archives, SHA256SUMS, the GPG
# signature, and the registry manifest, so no release has to be created
# manually on GitHub first.
name: Terraform Provider Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
          persist-credentials: false
      # The toolchain (Go, goreleaser) comes from mise.toml, so CI runs the
      # exact same release command as local development: mise run release.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          # Signed release artifacts must not come from a cache that a
          # pull request could have poisoned.
          cache: false
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@82a020f1f7f605c65dd2449b392a52c3fcfef7ef # v6.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASS }}
      - name: Run GoReleaser
        run: mise run release
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
