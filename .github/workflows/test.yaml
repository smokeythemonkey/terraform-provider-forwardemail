# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# The whole toolchain (Go, Terraform, linters, docs generator) comes from
# mise.toml, so CI runs the exact same commands as local development.
on:
  pull_request:
    paths:
      - "main.go"
      - "forwardemail/**.go"
      - "internal/**.go"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "docs/**"
      - "examples/**"
      - ".goreleaser.yaml"
      - ".github/workflows/test.yaml"
      - ".github/workflows/release.yaml"
      - "README.md"
      - ".go-version"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run build

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run lint

  docs:
    name: Docs Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Check if docs are up-to-date
        run: |
          mise run --force docs
          git diff -- docs/ examples/
          BADDOCS=$(git status --porcelain -- docs/ examples/)
          test -z "$BADDOCS" || (echo "documentation needs regenerating using 'mise run docs': $BADDOCS"; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions.
  # terraform-plugin-testing downloads the pinned Terraform CLI itself
  # (TF_ACC_TERRAFORM_VERSION), so no separate Terraform setup is needed.
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: test-${{ github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform:
          - '1.5.6'
          - '1.6.0'
          - '1.7.5'
          - '1.8.2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Run Acceptance Tests
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_VERSION: ${{ matrix.terraform }}
          FORWARDEMAIL_API_KEY: ${{ secrets.FORWARDEMAIL_API_KEY }}
        run: mise run test
        timeout-minutes: 15
